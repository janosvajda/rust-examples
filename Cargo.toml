# These are built on their own, from their own directories:
# - asm/hello_asm: platform-specific inline assembly
# - mini: a separate project with its own README (it runs LLVM's `llc`, 16 or newer)
# - no-std-and-bare-metal/01-calling-the-c-library and 03-custom-allocator:
#   no_std programs that need their own `panic = "abort"` profile, which Cargo
#   ignores for workspace members
# - no-std-and-bare-metal/05-webassembly-without-an-os: builds only for the
#   wasm32-unknown-unknown target
exclude = [
    "asm/hello_asm",
    "mini",
    "no-std-and-bare-metal/01-calling-the-c-library",
    "no-std-and-bare-metal/03-custom-allocator",
    "no-std-and-bare-metal/05-webassembly-without-an-os",
]
