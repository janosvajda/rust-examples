[package]
name = "async-channels-and-shared-state"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Enables Tokio's paused test clock; OS time and blocking work are unchanged.
tokio = { version = "1", features = ["full", "test-util"] }
