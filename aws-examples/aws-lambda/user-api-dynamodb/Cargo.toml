[package]
name = "aws-lambda-example-db"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ssm = "1"
lambda_http = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tracing = "0.1"
argon2 = "0.5"
# Argon2 salts need the operating system's random numbers (`OsRng`), which is
# behind rand_core's `getrandom` feature. rand_core is already used by argon2.
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9"

[dev-dependencies]
futures-util = "0.3"
anyhow = "1"
aws-credential-types = "1"
serial_test = "3"
