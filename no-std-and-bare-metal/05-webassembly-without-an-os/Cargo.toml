[package]
name = "bare-wasm"
version = "0.1.0"
edition = "2024"

# A `cdylib` is a library meant to be loaded by something else, which is
# what a .wasm module is: the browser or Node.js loads it and calls into it.
[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = "z"    # optimise for size rather than speed
lto = true
codegen-units = 1
panic = "abort"
strip = true
