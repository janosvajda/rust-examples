name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace (clippy + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  no-std:
    name: no_std libc example
    runs-on: macos-latest
    defaults:
      run:
        working-directory: no_std_call_libc_functions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run

  asm:
    name: Inline asm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: asm/hello_asm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run

  mini:
    name: Mini (LLVM 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "16"
      - run: cargo clippy --all-targets -- -D warnings
        env:
          LLVM_SYS_160_PREFIX: ${{ env.LLVM_PATH }}
      - run: cargo build
        env:
          LLVM_SYS_160_PREFIX: ${{ env.LLVM_PATH }}
