name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace (clippy + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  no-std:
    name: no_std (${{ matrix.lesson }})
    strategy:
      fail-fast: false
      matrix:
        lesson: [01-calling-the-c-library, 03-custom-allocator]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: no-std-and-bare-metal/${{ matrix.lesson }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run

  bare-wasm:
    name: no_std WebAssembly module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: no-std-and-bare-metal/05-webassembly-without-an-os
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - run: node run.mjs

  hello-syscall:
    # System calls written by hand in inline assembly: different for every
    # operating system and processor, so each one runs for real.
    name: System calls by hand (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p hello-syscall -- -D warnings
      - run: cargo run -p hello-syscall

  aws-lambda-dynamodb:
    # The user API's integration tests need a real DynamoDB. The official
    # DynamoDB Local image runs next to the job; REQUIRE_DYNAMODB makes the
    # tests fail, instead of silently skipping, if it can't be reached.
    name: AWS Lambda user API (DynamoDB Local)
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      REQUIRE_DYNAMODB: "1"
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p aws-lambda-example-db

  mini:
    name: Mini (any LLVM 16+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Mini runs the installed LLVM's `llc`, so the distribution's LLVM is enough.
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - run: llc --version
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: |
          for example in examples/*.mini; do
            cargo run -q -- "$example" "/tmp/$(basename "$example" .mini)"
            "/tmp/$(basename "$example" .mini)"
          done
